# Project root containing VisDocBench-parsed/ (relative to this directory).
# Override with the VISDOCBENCH_ROOT environment variable.
dataset_root: ".."
assets_dir: "assets"   # generated by download_data.py --assets

api:
  # Any OpenAI-compatible chat-completions endpoint.
  # Override with OPENAI_BASE_URL / OPENAI_API_KEY / OPENAI_MODEL.
  base_url: ""        # e.g. https://<your-endpoint>/v1
  api_key: ""         # or "EMPTY" for servers that ignore auth
  model: ""           # multimodal model id
  temperature: 0.0
  top_p: 1.0
  max_tokens: 2048
  enable_thinking: false
  timeout: 180
  retries: 3

render:
  dpi: 120
  max_pages_total: 6      # QA: max page images across all source documents
  max_pages_per_doc: 2    # QA: pages retrieved per source document
  max_doc_pages: 12       # cross-page: pages sampled from the shuffled document
